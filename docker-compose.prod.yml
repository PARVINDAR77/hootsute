# ==============================================================================
# OmniSocial AI — Production Docker Compose Orchestration
# ==============================================================================
# Architecture:
# - postgres: Internal relational store (isolated, no external port exposure)
# - api: NestJS backend service (healthchecked against /api/v1/health)
# - web: Next.js standalone web frontend (healthchecked against root HTTP)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnisocial-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hootsute_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hootsute_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omnisocial_internal
    # Internal port only: Not exposed to host network for production security

  redis:
    image: redis:7-alpine
    container_name: omnisocial-prod-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-omnisocial_redis_prod_secret}" --save 60 1 --loglevel notice
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-omnisocial_redis_prod_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - omnisocial_internal
    # Internal network only: No ports exposed to host or internet for zero-trust perimeter security

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: omnisocial-api:latest
    container_name: omnisocial-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hootsute_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-omnisocial_redis_prod_secret}@redis:6379
      RATE_LIMIT_REDIS_FALLBACK: fail-closed
      LOG_FORMAT: json
    ports:
      # Bound to loopback interface so host reverse proxy (Nginx/Traefik/Caddy) can proxy requests
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - omnisocial_internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-OmniSocial AI}
    image: omnisocial-web:latest
    container_name: omnisocial-prod-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      # Bound to loopback interface so host reverse proxy can proxy requests
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - omnisocial_internal

networks:
  omnisocial_internal:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
